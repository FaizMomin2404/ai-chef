services:
  - type: web
    name: ai-chef
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      # Hosted inference. GROQ_API_KEY is entered in the Render dashboard and
      # is never stored in this repository.
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      # Per-browser session isolation; Render's disk is ephemeral so session
      # resume is intentionally disabled.
      - key: MULTI_USER
        value: "1"
      - key: SESSION_PERSISTENCE
        value: "0"
      - key: MAX_CONNECTIONS
        value: "25"
      # The browser handles microphone and speech output over HTTPS.
      - key: STT_MODE
        value: browser
      - key: TTS_MODE
        value: browser
      - key: TTS_ENABLED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.8
